name: Build Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FINALPACKAGE: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS_PACKAGE_SCHEME: roothide

jobs:
  build:
    name: Build (roothide arm64e)
    runs-on: macos-15

    steps:
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'

    - name: Install Theos dependencies
      run: |
        brew install ldid xz dpkg
        echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
        command -v ldid
        command -v xz
        command -v dpkg-deb

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Theos (roothide)
      run: |
        echo "$GITHUB_WORKSPACE/theos/bin" >> "$GITHUB_PATH"
        echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
        echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> "$HOME/.theosrc"

    - name: Checkout Theos
      uses: actions/checkout@v4
      with:
        repository: roothide/theos
        ref: d4826f4e54127cfe1de88103b69b92107591c05b
        path: theos
        submodules: recursive

    - name: Install iOS SDK (with 504 fallback)
      run: |
        cd "$THEOS"
        if ./bin/install-sdk iPhoneOS16.5; then
          exit 0
        fi
        echo "install-sdk failed; seeding SDK from release API"
        python3 - "$THEOS/sdks" <<'PY'
        import json, os, re, shutil, sys, tarfile, urllib.request
        dest = sys.argv[1]
        headers = {"Accept": "application/vnd.github+json", "User-Agent": "reachdeck-ci"}
        token = os.environ.get("GITHUB_TOKEN", "")
        if token:
            headers["Authorization"] = "Bearer " + token

        def fetch(url, accept):
            h = dict(headers); h["Accept"] = accept
            return urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=300)

        with fetch("https://api.github.com/repos/theos/sdks/releases/latest",
                   "application/vnd.github+json") as r:
            release = json.load(r)

        def version(asset):
            m = re.match(r"iPhoneOS(\d+(?:\.\d+)*)\.sdk\.tar\.xz$", asset["name"])
            return tuple(int(p) for p in m.group(1).split(".")) if m else ()

        asset = sorted((a for a in release["assets"] if version(a)), key=version)[-1]
        sdk = asset["name"][: -len(".tar.xz")]
        os.makedirs(dest, exist_ok=True)
        shutil.rmtree(os.path.join(dest, sdk), ignore_errors=True)
        archive = os.path.join(dest, asset["name"])
        url = "https://api.github.com/repos/theos/sdks/releases/assets/%d" % asset["id"]
        with fetch(url, "application/octet-stream") as r, open(archive, "wb") as f:
            shutil.copyfileobj(r, f)
        with tarfile.open(archive) as tar:
            tar.extractall(dest)
        os.remove(archive)
        print("sdks now:", sorted(os.listdir(dest)))
        PY
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build (roothide arm64e)
      run: |
        make clean package
      env:
        THEOS_PACKAGE_SCHEME: roothide

    - name: Verify package
      run: |
        ls -la packages/
        for deb in packages/*.deb; do
          echo "=== $deb ==="
          dpkg-deb -f "$deb" Package Version Architecture
        done

    - name: Upload Packages
      uses: actions/upload-artifact@v4
      with:
        name: packages-roothide
        path: |
          ./packages/*.deb
        if-no-files-found: error
